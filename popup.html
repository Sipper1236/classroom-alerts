<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Classroom Alerts</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><header><h1>Classroom Alerts</h1><button id="dashboard">Dashboard & settings</button></header>
<p id="freshness" role="status">Loading cached tasks…</p><section aria-labelledby="next-title"><h2 id="next-title">Next up</h2><div id="next"></div></section>
<p id="version-warning" role="status" hidden></p>
<p><button id="scan" disabled>Scan all courses</button> <button id="course" disabled>Scan this course</button> <button id="page" disabled>Scan this page</button></p>
<p id="delivery" role="status"></p><output id="status" aria-live="polite"></output><script src="build.js"></script><script src="core.js"></script><script src="popup.js"></script></body></html>
